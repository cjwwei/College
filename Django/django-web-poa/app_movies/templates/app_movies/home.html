{% extends 'base.html' %}

{% block title %} 豆瓣電影評分分析 {% endblock %}

{% block content %}
<div class="col-lg-12">
    <h1>豆瓣電影評分分析</h1>
    <p>分析當前熱門電影的豆瓣評分情況</p>
</div>

<div class="col-lg-12 mb-5">
    <div class="card">
        <div class="card-header">
            <h3 class="h6 text-uppercase mb-0">熱門電影評分排行 (Top 20)</h3>
        </div>
        <div class="card-body">
            <canvas id="movieChart"></canvas>
        </div>
    </div>
</div>

<div class="col-lg-12 mb-5">
    <div class="card">
        <div class="card-header">
            <h3 class="h6 text-uppercase mb-0">電影評分詳細列表</h3>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>電影名稱</th>
                            <th>豆瓣評分</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for movie, rating in movie_data %}
                        <tr>
                            <td>{{ movie }}</td>
                            <td><span class="badge bg-primary">{{ rating }}</span></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.3/Chart.min.js"></script>
<script>
    $(document).ready(function() {
        call_ajax();
    });

    function call_ajax() {
        $.ajax({
            type: "GET",
            url: "{% url 'app_movies:api_get_movie_data' %}",
            success: function(received) {
                drawChart(received.labels, received.values);
                updateTable(received.labels, received.values);
            }
        });
    }

    function drawChart(labels, values) {
        let ctx = document.getElementById('movieChart').getContext('2d');
        new Chart(ctx, {
            type: 'horizontalBar',
            data: {
                labels: labels,
                datasets: [{
                    label: '電影評分',
                    data: values,
                    backgroundColor: randomColors(values.length),
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    xAxes: [{
                        ticks: {
                            beginAtZero: true,
                            max: 10
                        }
                    }]
                }
            }
        });
    }

    function updateTable(labels, values) {
        let tbody = $('tbody');
        tbody.empty();
        for (let i = 0; i < labels.length; i++) {
            tbody.append(`
                <tr>
                    <td>${labels[i]}</td>
                    <td><span class="badge bg-primary">${values[i]}</span></td>
                </tr>
            `);
        }
    }

    function randomColors(length) {
        let colors = [];
        for (let i = 0; i < length; i++) {
            let r = Math.floor(Math.random() * 255);
            let g = Math.floor(Math.random() * 255);
            let b = Math.floor(Math.random() * 255);
            colors.push(`rgba(${r}, ${g}, ${b}, 0.6)`);
        }
        return colors;
    }
</script>
{% endblock %}
