{% extends 'base.html' %}
{% block title %} 新聞與留言情緒監測 {% endblock %}
{% block content %}
<div class="col-md-6 mt-3">
    <h2 class="h4 mb-0">新聞與留言情緒監測</h2>
    <p class="text-muted mb-0">即時掌握最新的新聞風向與社群留言情緒分佈。</p>
</div>
<div class="col-md-6 text-md-end mt-3">
    <div class="input-group">
        <input type="text" id="searchInput" class="form-control" placeholder="輸入關鍵字檢索標題或內文...">
        <button id="searchBtn" class="btn btn-primary">搜尋</button>
        <button id="clearBtn" class="btn btn-outline-secondary">清除</button>
    </div>
</div>

<div class="col-12 mt-4">
    <div id="articlesContainer">
        <!-- Articles will be rendered here by JavaScript -->
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    $(document).ready(function() {
        // 初始化首頁：顯示最新和最熱門新聞
        loadDefaultPage();

        // 綁定搜尋事件
        $("#searchBtn").click(function() {
            const query = $("#searchInput").val();
            fetchData(query);
        });

        $("#clearBtn").click(function() {
            $("#searchInput").val("");
            fetchData();
        });

        $("#searchInput").keypress(function(e) {
            if (e.key === "Enter") {
                $("#searchBtn").click();
            }
        });
        
    });

    // 加載預設首頁：最新一則和最熱門一則新聞
    function loadDefaultPage() {
        const container = $("#articlesContainer");
        
        container.html("");

        $.ajax({
            url: 'api/data/',
            type: 'GET',
            success: function(data) {
                if (data.articles && data.articles.length > 0) {
                    // 取最新的一則
                    const latestArticle = data.articles[0];
                    
                    // 取最熱門的一則（以留言數量）
                    let popularArticle = data.articles[0];
                    for (let article of data.articles) {
                        if (article.comments_count > popularArticle.comments_count) {
                            popularArticle = article;
                        }
                    }
                    
                    // 如果只有一則新聞，就只顯示那一則
                    const articlesToShow = latestArticle.id === popularArticle.id 
                        ? [latestArticle] 
                        : [latestArticle, popularArticle];
                    
                    renderArticles(articlesToShow);
                } else {
                    container.html('<div class="col-12"><div class="alert alert-info">目前沒有新聞資料。</div></div>');
                }
            },
            error: function(xhr, status, error) {
                container.html('<div class="alert alert-danger">資料載入失敗，請稍後再試。</div>');
                console.error('錯誤:', error);
            }
        });
    }

    // 使用 jQuery AJAX 獲取數據
    function fetchData(query = "") {
        const container = $("#articlesContainer");
        
        container.html("");

        const url = query ? 'api/data/?q=' + encodeURIComponent(query) : 'api/data/';

        $.ajax({
            url: url,
            type: 'GET',
            success: function(data) {
                renderArticles(data.articles);
            },
            error: function(xhr, status, error) {
                container.html('<div class="alert alert-danger">資料載入失敗，請稍後再試。</div>');
                console.error('錯誤:', error);
            }
        });
    }

    function renderArticles(articles) {
        const container = $("#articlesContainer");
        
        if (!articles || articles.length === 0) {
            container.html('<div class="col-12"><div class="alert alert-info">目前沒有符合條件的新聞資料。</div></div>');
            return;
        }

        articles.forEach((article) => {
            let chartsHtml = "";
            let analyzedBadge = "";
            
            if (article.analyzed) {
                analyzedBadge = '<span class="badge bg-success ms-2">已分析</span>';
                
                const hasData = Object.values(article.emotion).some(v => v > 0);
                let emotionBarHtml = "";
                
                if (hasData) {
                    const e = article.emotion;
                    emotionBarHtml = `
                        <div class="small text-muted mb-3 p-3 bg-light border rounded text-start">
                            <strong class="text-dark">AI 留言分析</strong><br>
                            本服務使用 OpenAI 之技術進行留言情緒分析，並僅取用熱門排序下的前 30 則留言進行分析。此情緒分析結果僅供參考，Yahoo 不對分析結果的準確性或完整性作出任何保證，亦不對其分析結果承擔任何責任。
                        </div>
                        <div class="d-flex justify-content-between text-center align-items-end mt-4 px-2">
                            <div style="color: #17a2b8;">
                                <div class="fs-4 fw-bold">${e.cheer_up}%</div>
                                <div class="small fw-semibold">打氣</div>
                            </div>
                            <div style="color: #ffc107;">
                                <div class="fs-4 fw-bold">${e.happy}%</div>
                                <div class="small fw-semibold">開心</div>
                            </div>
                            <div style="color: #fd7e14;">
                                <div class="fs-4 fw-bold">${e.mixed}%</div>
                                <div class="small fw-semibold">五味雜陳</div>
                            </div>
                            <div style="color: #6610f2;">
                                <div class="fs-4 fw-bold">${e.dumbfounded}%</div>
                                <div class="small fw-semibold">傻眼</div>
                            </div>
                            <div style="color: #dc3545;">
                                <div class="fs-4 fw-bold">${e.angry}%</div>
                                <div class="small fw-semibold">生氣</div>
                            </div>
                            <div style="color: #343a40;">
                                <div class="fs-4 fw-bold">${e.sad}%</div>
                                <div class="small fw-semibold">悲傷</div>
                            </div>
                        </div>
                    `;
                } else {
                    emotionBarHtml = '<div class="alert alert-secondary mt-3">目前無留言數據</div>';
                }

                chartsHtml = `
                    <div class="row mt-4">
                        <div class="col-md-5 text-center">
                            <h6 class="mb-3 fw-bold">新聞情緒基調</h6>
                            <div style="height: 200px; display: flex; justify-content: center;">
                                <canvas id="chart-article-${article.id}"></canvas>
                            </div>
                            <div class="mt-2 small">
                                <span class="text-success fw-bold">正面: ${article.positive_score !== null ? (article.positive_score * 100).toFixed(1) + '%' : 'N/A'}</span> | 
                                <span class="text-secondary fw-bold">中立: ${article.neutral_score !== null ? (article.neutral_score * 100).toFixed(1) + '%' : 'N/A'}</span> | 
                                <span class="text-danger fw-bold">負面: ${article.negative_score !== null ? (article.negative_score * 100).toFixed(1) + '%' : 'N/A'}</span>
                            </div>
                        </div>
                        <div class="col-md-7 border-start">
                            <h6 class="mb-3 fw-bold text-center">留言情緒分佈</h6>
                            ${emotionBarHtml}
                        </div>
                    </div>
                `;
            } else {
                analyzedBadge = '<span class="badge bg-warning text-dark ms-2">等待分析</span>';
            }

            let contentSnippet = article.content ? article.content.replace(/\n/g, '<br>') : '無內容';
            let commentsHtml = '';
            
            if (article.comments && article.comments.length > 0) {
                commentsHtml = article.comments.map(c => 
                    `<li class="list-group-item d-flex justify-content-between align-items-start">
                        <div class="me-auto">${c.content}</div>
                        <span class="badge bg-light text-dark rounded-pill ms-2">👍 ${c.upvotes || 0}</span>
                    </li>`
                ).join('');
            } else {
                commentsHtml = '<li class="list-group-item text-muted">目前沒有留言資料</li>';
            }

            const articleHtml = `
                <div class="col-12 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center bg-white border-bottom">
                            <div>
                                <span class="badge bg-info me-2">${article.category || '未分類'}</span>
                                <span class="text-muted small">發布日期: ${article.published_date || '未知'}</span>
                            </div>
                            <span class="badge bg-secondary">共 ${article.comments_count} 則留言</span>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title lh-base">
                                <a href="${article.url}" target="_blank" class="text-decoration-none text-dark fw-bold">${article.title}</a>
                                ${analyzedBadge}
                            </h5>
                            
                            ${chartsHtml}
                            
                            <div class="mt-4 pt-3 border-top text-center">
                                <button class="btn btn-outline-primary btn-sm rounded-pill px-4" type="button" data-bs-toggle="collapse" data-bs-target="#content-${article.id}" aria-expanded="false">
                                    📃 檢視全文與熱門留言
                                </button>
                            </div>
                            
                            <div class="collapse mt-4" id="content-${article.id}">
                                <div class="card border-0 bg-light mb-4">
                                    <div class="card-body">
                                        <h6 class="card-subtitle mb-2 text-primary fw-bold">📰 新聞內容</h6>
                                        <p class="card-text small text-muted" style="line-height: 1.6;">${contentSnippet}</p>
                                    </div>
                                </div>
                                
                                <h6 class="text-primary fw-bold px-2 mb-2">💬 熱門留言 (前30則)</h6>
                                <div class="card border-0">
                                    <ul class="list-group list-group-flush small">
                                        ${commentsHtml}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            container.append(articleHtml);

            if (article.analyzed) {
                // 使用 setTimeout 確保 DOM 已更新
                setTimeout(() => renderArticleChart(article.id, article), 100);
            }
        });
    }

    function renderArticleChart(id, article) {
        const el = document.getElementById('chart-article-' + id);
        if (!el) return;
        const ctx = el.getContext('2d');
        
        // Ensure we're not creating duplicate charts by destroying existing ones
        if (window.articleCharts && window.articleCharts[id]) {
            window.articleCharts[id].destroy();
        }
        
        // Initialize chart array if it doesn't exist
        if (!window.articleCharts) {
            window.articleCharts = {};
        }
        
        // Create new chart
        window.articleCharts[id] = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['正面', '負面', '中立'],
                datasets: [{
                    data: [article.positive_score, article.negative_score, article.neutral_score],
                    backgroundColor: ['#28a745', '#dc3545', '#6c757d'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }
</script>
{% endblock %}
